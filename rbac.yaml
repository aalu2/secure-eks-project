apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-user
  namespace: secure-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-read-only-role
  namespace: secure-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-read-only-binding
  namespace: secure-demo
subjects:
  - kind: ServiceAccount
    name: student-user
    namespace: secure-demo
roleRef:
  kind: Role
  name: student-read-only-role
  apiGroup: rbac.authorization.k8s.io